# Copy to .github/workflows/native-realtime-ci.yml in the reviewed fork.
# Manual, secret-free validation only: no installer, IME registration, or Release.
# The CI-only examples/native_realtime_probe.rs must be present on the tested ref.
name: Native Realtime Windows validation
run-name: Native Realtime Windows · ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-realtime-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Core contracts and frontend
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: openless-all/app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: native-realtime-windows-rust199
          workspaces: 'openless-all/app -> src-tauri/target'
          cache-on-failure: true

      - name: Record pinned compiler and source
        run: |
          $ErrorActionPreference = 'Stop'
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'rustc version failed' }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'cargo version failed' }
          rustfmt --version
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt version failed' }
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'source revision unavailable' }
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

      - name: Produce Core format patch in the disposable checkout
        id: core_format
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --manifest-path Cargo.toml --package openless-core
          if ($LASTEXITCODE -ne 0) { throw 'Core cargo fmt failed' }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/format.patch'
          git diff --binary --no-ext-diff --output=$patch -- crates/openless-core
          if ($LASTEXITCODE -ne 0) { throw 'Unable to capture format.patch' }
          $changed = (Get-Item -LiteralPath $patch).Length -gt 0
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($changed) {
            'Core formatting differs from the tested commit. Download format.patch and apply it before the final build.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Core formatting matches Rust 1.99.0 rustfmt; format.patch is empty.' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Core format patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-realtime-format-patch
          retention-days: 14
          path: ci-evidence/format.patch
          if-no-files-found: warn

      - name: Check normalized Core formatting
        timeout-minutes: 5
        run: |
          cargo fmt --manifest-path Cargo.toml --package openless-core -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Core rustfmt check failed' }

      # Do not call a live API or supply credentials/audio. These tests use fixtures
      # and local mock transports. Ignored, device/live-service tests stay ignored.
      - name: Run all Core test targets
        timeout-minutes: 30
        run: |
          cargo test --locked --manifest-path Cargo.toml --package openless-core --all-targets --target-dir src-tauri/target --timings
          if ($LASTEXITCODE -ne 0) { throw 'Core test targets failed' }

      - name: Run Core documentation tests
        timeout-minutes: 10
        run: |
          cargo test --locked --manifest-path Cargo.toml --package openless-core --doc --target-dir src-tauri/target --timings
          if ($LASTEXITCODE -ne 0) { throw 'Core documentation tests failed' }

      - name: Verify both provider catalogs using the official exporter
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          cargo run --locked --manifest-path Cargo.toml --package openless-core --example export_provider_descriptors --target-dir src-tauri/target
          if ($LASTEXITCODE -ne 0) { throw 'Official provider descriptor exporter failed' }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/provider-descriptors.patch'
          git diff --binary --no-ext-diff --output=$patch -- src/lib/ipc/provider-descriptors.generated.json src/lib/ipc/mock-provider-descriptors.json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to capture provider descriptor diff' }
          git diff --exit-code -- src/lib/ipc/provider-descriptors.generated.json src/lib/ipc/mock-provider-descriptors.json
          if ($LASTEXITCODE -ne 0) { throw 'Provider catalogs differ from the official Core exporter' }

      - name: Build the CI-only native Realtime probe
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'crates/openless-core/examples/native_realtime_probe.rs' -PathType Leaf)) {
            throw 'The tested CI branch must contain the reviewed CI-only native_realtime_probe.rs example'
          }
          cargo build --locked --manifest-path Cargo.toml --package openless-core --example native_realtime_probe --target-dir src-tauri/target
          if ($LASTEXITCODE -ne 0) { throw 'CI-only native Realtime probe failed to compile' }
          $exe = 'src-tauri/target/debug/examples/native_realtime_probe.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Probe EXE was not produced' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            schema = 'openless.native-realtime.probe-build.v1'
            source_sha = $env:GITHUB_SHA
            source_ref = $env:GITHUB_REF
            run_id = $env:GITHUB_RUN_ID
            rust = '1.99.0-x86_64-pc-windows-msvc'
            profile = 'dev'
            executable = 'native_realtime_probe.exe'
            sha256 = $hash
            format_patch_present = ('${{ steps.core_format.outputs.changed }}' -eq 'true')
            live_api_called_in_ci = $false
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/native-realtime-probe-provenance.json') -Encoding utf8NoBOM

      - name: Upload the CI-only native probe
        uses: actions/upload-artifact@v4
        with:
          name: native-realtime-probe-windows-x64
          retention-days: 14
          path: |
            openless-all/app/src-tauri/target/debug/examples/native_realtime_probe.exe
            ci-evidence/native-realtime-probe-provenance.json
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: openless-all/app/package-lock.json

      - name: Install locked frontend dependencies
        timeout-minutes: 10
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }

      - name: Build frontend
        timeout-minutes: 10
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }

      - name: Require formatting to match the original commit
        if: steps.core_format.outputs.changed == 'true'
        run: |
          throw 'Rustfmt changed the disposable checkout. Download native-realtime-format-patch, apply format.patch, commit it, then dispatch again. The Windows host build is intentionally gated.'

      - name: Save validated frontend for the host build
        uses: actions/upload-artifact@v4
        with:
          name: native-realtime-frontend
          retention-days: 3
          path: openless-all/app/dist
          if-no-files-found: error

      - name: Upload Core evidence and Cargo timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-realtime-core-evidence
          retention-days: 14
          path: |
            ci-evidence/*.json
            ci-evidence/*.patch
            openless-all/app/src-tauri/target/cargo-timings/*.html
          if-no-files-found: warn

  windows_host:
    name: Compile Windows Tauri host
    needs: contracts
    runs-on: windows-2025
    timeout-minutes: 110
    defaults:
      run:
        shell: pwsh
        working-directory: openless-all/app
    env:
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_STRIP: none
      OPENLESS_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: native-realtime-windows-rust199
          workspaces: 'openless-all/app -> src-tauri/target'
          cache-on-failure: true

      - name: Restore the validated embedded frontend
        uses: actions/download-artifact@v4
        with:
          name: native-realtime-frontend
          path: openless-all/app/dist

      - name: Prepare existing Windows Sherpa static libraries
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/prepare-windows-sherpa.ps1

      # Direct Cargo build embeds the already-validated frontend via the default
      # custom-protocol feature. It does not invoke an installer/bundler or load IME.
      - name: Compile the real Windows release EXE
        timeout-minutes: 90
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml --release --bin openless --timings
          if ($LASTEXITCODE -ne 0) { throw 'Windows Tauri release compilation failed' }

      - name: Record validation artifact hashes and provenance
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'ci-host-artifact'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $exe = (Resolve-Path -LiteralPath 'src-tauri/target/release/openless.exe').Path
          Copy-Item -LiteralPath $exe -Destination (Join-Path $destination 'openless.exe')
          $pdb = 'src-tauri/target/release/openless.pdb'
          if (Test-Path -LiteralPath $pdb -PathType Leaf) {
            Copy-Item -LiteralPath $pdb -Destination (Join-Path $destination 'openless.pdb')
          }
          $files = @(Get-ChildItem -LiteralPath $destination -File | ForEach-Object {
            [ordered]@{ name = $_.Name; size = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          [ordered]@{
            schema = 'openless.native-realtime.windows-build.v1'
            source_sha = $env:GITHUB_SHA
            source_ref = $env:GITHUB_REF
            workflow_sha = $env:GITHUB_WORKFLOW_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            rust = '1.99.0-x86_64-pc-windows-msvc'
            app_version = (Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
            profile = 'release'
            bundle_or_installer_created = $false
            ime_registered_or_loaded_in_ci = $false
            live_api_called_in_ci = $false
            signed = $false
            files = $files
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $destination 'provenance.json') -Encoding utf8NoBOM
          @'
          Validation artifact only; not an installed or signed release.
          Frontend is embedded. No installer or IME DLL is included or registered.
          No live API/audio acceptance test ran in CI. Review provenance and isolate
          the local test profile before launching; do not overwrite production.
          '@ | Set-Content -LiteralPath (Join-Path $destination 'README.txt') -Encoding utf8NoBOM

      - name: Upload Windows EXE for controlled local verification
        uses: actions/upload-artifact@v4
        with:
          name: native-realtime-windows-x64
          retention-days: 14
          path: ci-host-artifact
          if-no-files-found: error

      - name: Upload Windows host Cargo timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-realtime-windows-host-timings
          retention-days: 14
          path: openless-all/app/src-tauri/target/cargo-timings/*.html
          if-no-files-found: warn
